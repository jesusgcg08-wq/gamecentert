[build]
  functions = "netlify/functions"

[functions]
  external_node_modules = ["firebase-admin"]

[dev]
  framework = "#static"
  publish = "."
# ---- Google (SEO) ----
# Mapa del sitio: lo arma una funcion con los productos activos de Firestore.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Paginas para Google con direccion limpia (sin .html)
[[redirects]]
  from = "/recargas-free-fire-venezuela"
  to = "/recargas-free-fire-venezuela.html"
  status = 200

[[redirects]]
  from = "/recargas-call-of-duty-mobile-venezuela"
  to = "/recargas-call-of-duty-mobile-venezuela.html"
  status = 200

[[redirects]]
  from = "/recargas-blood-strike-venezuela"
  to = "/recargas-blood-strike-venezuela.html"
  status = 200

[[redirects]]
  from = "/recargas-pubg-mobile-venezuela"
  to = "/recargas-pubg-mobile-venezuela.html"
  status = 200

[[redirects]]
  from = "/recargas-mobile-legends-venezuela"
  to = "/recargas-mobile-legends-venezuela.html"
  status = 200

# ---- Archivos internos: no se publican (responden "no existe") ----
# catalogo.html tiene precios de costo de Central One: abrelo desde la carpeta.
[[redirects]]
  from = "/catalogo.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/catalogo"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cobertura.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/LEEME.txt"
  to = "/404.html"
  status = 404
  force = true

# Codigo de las funciones del servidor (no confundir con /.netlify/functions/)
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
